name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_snake.py"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }' -f login="${{ github.repository_owner }}" > contrib.json

      - name: Generate snake SVGs
        run: |
          python scripts/generate_snake.py contrib.json assets/snake-dark.svg --theme dark
          python scripts/generate_snake.py contrib.json assets/snake-light.svg --theme light
          rm -f contrib.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake-dark.svg assets/snake-light.svg
          git diff --cached --quiet || git commit -m "Update contribution snake animation"
          git push
